<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0c29" />
  <title>Alpine.js Keren 🔥</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }
    .orb-1 {
      width: 200px; height: 200px;
      background: #ff00cc;
      top: -80px; left: -80px;
      animation: float 8s ease-in-out infinite;
    }
    .orb-2 {
      width: 260px; height: 260px;
      background: #00d4ff;
      bottom: -100px; right: -100px;
      animation: float 10s ease-in-out infinite reverse;
    }
    .orb-3 {
      width: 150px; height: 150px;
      background: #7b2ff7;
      top: 50%; right: 10%;
      animation: float 12s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); }
      50% { transform: translateY(-25px) translateX(15px); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      background: linear-gradient(90deg, #ff00cc33, #00d4ff33);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #a5f3fc;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(24px, 7vw, 34px);
      font-weight: 800;
      line-height: 1.15;
      background: linear-gradient(90deg, #fff, #a5f3fc, #f0abfc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .counter-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .counter-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .counter-value {
      font-size: 40px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(90deg, #00d4ff, #f0abfc);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .counter-value.bump {
      transform: scale(1.15);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    button {
      flex: 1;
      padding: 13px 12px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, #7b2ff7, #f107a3);
      color: #fff;
      box-shadow: 0 6px 20px rgba(241, 7, 163, 0.35);
    }
    .btn-primary:active {
      transform: scale(0.96);
      box-shadow: 0 4px 14px rgba(241, 7, 163, 0.55);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-ghost:active {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(0.96);
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    input[type="text"] {
      flex: 1;
      padding: 13px 16px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
      min-width: 0;
    }
    input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.4); }
    input[type="text"]:focus {
      border-color: #00d4ff;
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.15);
    }

    .btn-add {
      padding: 13px 18px;
      background: linear-gradient(135deg, #00d4ff, #7b2ff7);
      color: #fff;
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.3);
      flex: 0 0 auto;
    }
    .btn-add:active {
      transform: scale(0.96);
      box-shadow: 0 4px 14px rgba(0, 212, 255, 0.5);
    }

    .list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-track { background: transparent; }
    .list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      gap: 10px;
      animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .list-item:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .list-item span {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.9);
      word-break: break-word;
      flex: 1;
      min-width: 0;
    }

    .btn-delete {
      background: rgba(255, 60, 100, 0.15);
      color: #ff6b9d;
      border: 1px solid rgba(255, 60, 100, 0.3);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex: 0 0 auto;
      transition: all 0.2s ease;
    }
    .btn-delete:active {
      background: rgba(255, 60, 100, 0.35);
      color: #fff;
      transform: scale(0.94);
    }

    .empty {
      text-align: center;
      padding: 24px 16px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      font-style: italic;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
    }

    .footer span {
      color: #00d4ff;
      font-weight: 600;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(0, 212, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 212, 255, 0.4);
      color: #a5f3fc;
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Biar aman kalau dibuka di layar kecil banget */
    @media (max-width: 360px) {
      .container { padding: 22px 16px; }
      .counter-value { font-size: 34px; }
      button { font-size: 13px; padding: 12px 8px; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container" x-data="app()" x-init="init()">
    <span class="badge">⚡ Alpine.js 3.x</span>
    <h1>Halo, Coder Keren! 👋</h1>
    <p class="subtitle">
      Website interaktif dengan <b>Alpine.js</b>. Semua kode digabung dalam satu file. Coba klik tombol dan tambah data di bawah ya!
    </p>

    <div class="counter-box">
      <div>
        <div class="counter-label">Counter</div>
        <div class="counter-value" :class="{ bump: bump }" x-text="count"></div>
      </div>
      <div style="font-size: 36px;">🎯</div>
    </div>

    <div class="btn-group">
      <button class="btn-primary" @click="increment()">+ Tambah</button>
      <button class="btn-ghost" @click="decrement()">− Kurang</button>
      <button class="btn-ghost" @click="reset()">↺ Reset</button>
    </div>

    <div class="input-group">
      <input
        type="text"
        placeholder="Tulis sesuatu..."
        x-model="newItem"
        @keydown.enter="addItem()"
      />
      <button class="btn-add" @click="addItem()">Tambah</button>
    </div>

    <ul class="list">
      <template x-for="(item, index) in items" :key="index">
        <li class="list-item">
          <span x-text="item"></span>
          <button class="btn-delete" @click="removeItem(index)">Hapus</button>
        </li>
      </template>
      <template x-if="items.length === 0">
        <li class="empty">Belum ada item. Tambahkan sesuatu! ✨</li>
      </template>
    </ul>

    <div class="footer">
      Dibuat dengan ❤️ menggunakan <span>Alpine.js</span>
    </div>
  </div>

  <div class="toast" :class="{ show: toast.show }" x-text="toast.message" x-data></div>

  <script>
    function app() {
      return {
        count: 0,
        bump: false,
        newItem: '',
        items: ['Website keren', 'Alpine.js powerful', 'CSS Glassmorphism'],
        toast: { show: false, message: '' },
        toastTimer: null,

        init() {
          console.log('🚀 Alpine.js app berjalan!');
        },

        increment() {
          this.count++;
          this.triggerBump();
        },
        decrement() {
          if (this.count > 0) {
            this.count--;
            this.triggerBump();
          } else {
            this.showToast('Counter sudah 0 bro! 😅');
          }
        },
        reset() {
          this.count = 0;
          this.triggerBump();
          this.showToast('Counter direset! 🔄');
        },
        triggerBump() {
          this.bump = true;
          setTimeout(() => this.bump = false, 200);
        },

        addItem() {
          const text = this.newItem.trim();
          if (!text) {
            this.showToast('Isi dulu inputnya bro! ✍️');
            return;
          }
          this.items.unshift(text);
          this.newItem = '';
          this.showToast('Berhasil ditambahkan! ✅');
        },
        removeItem(index) {
          this.items.splice(index, 1);
          this.showToast('Item dihapus! 🗑️');
        },

        showToast(message) {
          this.toast.message = message;
          this.toast.show = true;
          clearTimeout(this.toastTimer);
          this.toastTimer = setTimeout(() => {
            this.toast.show = false;
          }, 2200);
        }
      }
    }
  </script>

</body>
</html>
